<!DOCTYPE html>
<html>
<head>
<title>lista ex 3</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .todo-app {
        text-align: center;
        max-width: 700px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #fff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    button {
        border: solid 1px gray;
        border-radius: 10px;
        background-color: rgba(0, 0, 0, 0);
        font-family: Arial, Helvetica, sans-serif;
        padding: 5px;
        width: 100px;
    }

    button:hover {
        background-color: gray;
        cursor: pointer;
    }
    #nota{
    padding: 10px;
    margin: 5px;
    }
    .repro{
    color: red;
    }
    .exame{
    color: green;
    }
    .apro{
    color: blue;
    }
</style>
</head>

<body>
    <div class="todo-app">
        <h2>calcular media</h2>
        <input type="text" id="name" placeholder="seu nome"><br><br>
        <input type="number" id="first" placeholder="nota 1" step="0.1">
        <input type="number" id="secund" placeholder="nota 2" step="0.1">
        <input type="number" id="third" placeholder="nota 3" step="0.1"><br><br>
        <button onclick="calcularMedia()">calcular</button>
        <h3 id="nota"></h3>
    </div>

    <script>
        var nomeAluno = document.getElementById("name");
        var notaUm = document.getElementById("first");
        var notaDois = document.getElementById("secund");
        var notaTres = document.getElementById("third");
        var divNota = document.getElementById("nota");

        function calcularMedia() {
            if (nomeAluno.value == "" || notaUm.value == "" || notaDois.value == "" || notaTres.value == "") {
                alert("preencha todos os campos");
                return;
            }

            var n1 = Number(notaUm.value);
            var n2 = Number(notaDois.value);
            var n3 = Number(notaTres.value);

            var soma = n1 + n2 + n3;
            var media = soma / 3;
            var mediaFormatada = media.toFixed(2);

            var classes = divNota.classList;
            classes.remove("repro");
            classes.remove("exame");
            classes.remove("apro");

            if (media < 4.0) {
                divNota.innerHTML = "<h3>" + nomeAluno.value + " sua media é: " + mediaFormatada + "</h3>";
                classes.add("repro");
            }

            if (media >= 4 && media <= 6.9) {
                var pontosParaPassar = (10 - media).toFixed(2);
                divNota.innerHTML = "<h3>" + nomeAluno.value + " sua media é: " + mediaFormatada + " e falta " + pontosParaPassar + " para passar</h3>";
                classes.add("exame");
            }

            if (media >= 7.0) {
                divNota.innerHTML = "<h3>" + nomeAluno.value + " sua media é: " + mediaFormatada + "</h3>";
                classes.add("apro");
            }
        }
    </script>
</body>
</html>
