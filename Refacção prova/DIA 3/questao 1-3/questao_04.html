<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogador da Copa do Mundo</title>
    <style> 
        body, html { height: 100%; margin: 0; }
        .bg-copa {
            background-image: url('img/FIFA-World-Cup-26.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .card-img-top { height: 300px; object-fit: cover; }
        .btn-reveal {
            margin-top: 20px;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-copa">
        <div class="d-flex flex-column align-items-center">       
            <div class="card" style="width: 18rem;">
                <img src="./img/img_.svg" id="avatar" class="card-img-top" alt="Placeholder">
            
                <div class="card-body"> 
                    <h5 id="Nome" class="card-title placeholder-glow">
                        <span class="placeholder col-8"></span>
                        <span id="Rank" class="badge text-bg-secondary">-</span>
                    </h5>
                    <p class="card-text placeholder-glow">
                        <span id="Data_Nas" class="placeholder col-10"></span><br>
                        <span id="Alutra" class="placeholder col-6"></span><br>
                        <span id="Posição " class="placeholder col-9"></span><br>
                    </p>
                </div>
            </div>
            
            <button onclick="revelar()" class="btn btn-primary btn-reveal shadow">
                Revelar Jogador
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
